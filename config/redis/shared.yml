# config/redis/shared.yml

production: &production
  url: <%= REDIS_URL_PRODUCTION %>
  timeout: 1

development: &development
  url: <%= REDIS_URL_DEVELOPMENT %>
  timeout: 1

test:
  url: <%=
    uri = URI.parse(REDIS_URL_TEST)
    uri.path = "/#{(TEST_ENV_NUMBER.presence || 1).to_i}"
    uri.to_s
  %>
  timeout: 1

