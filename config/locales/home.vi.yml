    multi_tenant:
      eyebrow: "Một lần đăng nhập, nhiều dự án riêng biệt"
      title: "Một tài khoản chính. Nhiều doanh nghiệp độc lập."
      intro: "Dành cho doanh nhân nhiều dự án, văn phòng đầu tư gia đình, đơn vị vận hành khách sạn-nhà hàng và chủ nhượng quyền. Đừng vật lộn với tài khoản phân mảnh, mật khẩu và các khoản phí cơ bản hàng tháng trùng lặp."
      cta: "Phí cơ bản $0 mỗi doanh nghiệp"
      card_1:
        title: "Một lần đăng nhập chính, nhiều dự án"
        body: "Vận hành cửa hàng thời trang, khách sạn và nhà hàng từ một tài khoản. Chuyển ngữ cảnh liền mạch bằng một cú nhấp — không đăng xuất, không mở nhiều tab, không cần ứng dụng riêng."
        bullet_1: "Cô lập hoàn toàn không gian làm việc & sổ chi nhánh riêng"
        bullet_2: "Phân quyền nhân viên chi tiết theo từng doanh nghiệp"
        bullet_3: "Bảng điều khiển, phân tích và thanh toán riêng theo doanh nghiệp"
        footer: "Chuyển doanh nghiệp 1 cú nhấp"
        badge: "Không gian độc lập"
      card_2:
        title: "Tín dụng trả trước theo doanh nghiệp"
        body: "Mỗi doanh nghiệp giữ số dư tín dụng và lịch sử sử dụng riêng, để chi phí luôn rõ ràng theo từng dự án. Không phí cơ bản hàng tháng và không phí theo ghế."
        bullet_1: "Số dư tín dụng và nhật ký sử dụng riêng theo doanh nghiệp"
        bullet_2: "Không phí cơ bản hàng tháng hoặc phí phần mềm theo ghế"
        bullet_3: "Lịch sử thanh toán và sử dụng luôn sẵn có"
        footer: "Ví tín dụng theo doanh nghiệp"
        badge: "Không phí cơ bản hàng tháng"
      card_3:
        title: "Tạo doanh nghiệp mới trong vài phút"
        body: "Thêm doanh nghiệp dưới cùng một lần đăng nhập và nhận chi nhánh, kho, vai trò, danh mục và nhân viên riêng. Mỗi doanh nghiệp hoàn toàn độc lập."
        bullet_1: "Chi nhánh, kho và nhân viên riêng theo doanh nghiệp"
        bullet_2: "Vai trò, danh mục và trường động khởi tạo sẵn"
        bullet_3: "Không phí thiết lập và không phí cơ bản hàng tháng"
        footer: "Không gian riêng cho mỗi doanh nghiệp"
        badge: "Không phí thiết lập"
    platform:
      eyebrow: "Lõi nền tảng"
      title: "Các trụ cột vận hành cốt lõi cho quy mô lớn"
      intro: "Năm bảng điều khiển vận hành chuyên biệt — POS, Đặt chỗ, Lễ tân, Tồn kho và Quản lý cửa hàng — cùng các thành phần danh mục, tồn kho, nhân sự và tiền tệ dùng chung bên dưới. Mọi doanh nghiệp vận hành trên cùng nền tảng."
      pos:
        title: "POS đám mây"
        body: "Thanh toán do máy chủ định giá với tồn kho, thuế, giảm giá và két khóa theo thời gian thực. Thanh toán tiền mặt và QR, in biên lai. Chỉ trực tuyến, không cần phần mềm cài đặt."
        bullet_1: "Thanh toán tiền mặt và QR"
        bullet_2: "Giá, tồn kho và thuế do máy chủ quyết định"
        bullet_3: "Giảm giá, hủy và in biên lai từ trình duyệt"
        footer: "Tồn kho & giá theo thời gian thực"
        badge: "Chỉ trực tuyến"
      inventory:
        title: "Tồn kho nhiều kho"
        body: "Một sổ tồn kho xuyên suốt chi nhánh và kho, với chuyển kho, nhập, xuất và điều chỉnh có lý do."
        bullet_1: "Sổ biến động tồn kho bất biến"
        bullet_2: "Chuyển kho giữa chi nhánh và kho"
        bullet_3: "Tồn kho thấp thành nháp đơn mua"
        footer: "Đặt lại thủ công thành đơn mua"
      hr:
        title: "Nhân sự, chấm công & hồ sơ đội ngũ"
        body: "Hồ sơ nhân viên, phòng ban, vai trò, tài liệu, mẫu ca, chấm công và đơn nghỉ phép ở một nơi."
        bullet_1: "Hồ sơ nhân viên, phòng ban và nhóm"
        bullet_2: "Mẫu ca, ngày chấm công và đơn nghỉ phép"
        bullet_3: "Lưu tài liệu và truy cập theo vai trò"
        footer: "Chấm công & nghỉ phép"
      gps:
        title: "Chấm công GPS theo vùng địa lý"
        body: "Chấm công được xác thực theo bán kính chi nhánh đã cấu hình và lưu tọa độ GPS để kiểm toán."
        bullet_1: "Bán kính chi nhánh có thể cấu hình"
        bullet_2: "Lưu tọa độ GPS và khoảng cách mỗi lần chấm công"
        bullet_3: "Lần chấm công bị từ chối không tạo sự kiện chấm công"
        footer: "Nhật ký kiểm toán GPS"
      calendar:
        title: "Lịch vận hành"
        body: "Lịch chung cho cuộc hẹn, đặt chỗ và lịch đội ngũ, với đặt phòng và không gian được kiểm tra trùng lịch."
        bullet_1: "Sự kiện và đặt chỗ tài nguyên"
        bullet_2: "Cơ sở vật chất, chủ nhà và khách trong mỗi đặt chỗ"
        bullet_3: "Gia hạn, kết thúc hoặc hủy từ bảng điều khiển"
        footer: "Đặt chỗ có kiểm tra trùng lịch"
      invoicing:
        title: "Hóa đơn & ảnh chụp thuế"
        body: "Chuyển đơn hàng thành hóa đơn, giữ trạng thái thanh toán và chụp lại thuế suất tại mỗi lần bán để thay đổi sau này không viết lại lịch sử."
        bullet_1: "Đơn hàng thành hóa đơn và biên lai"
        bullet_2: "Thuế suất được ghi lại theo từng lần bán"
        bullet_3: "Hóa đơn và trạng thái thanh toán theo chi nhánh"
        footer: "Thuế suất ghi lại theo từng lần bán"
    pricing:
      badge: "Bắt đầu miễn phí: Không phí cơ bản hàng tháng"
      title: "Bắt đầu miễn phí. Thêm doanh nghiệp không phí cơ bản hàng tháng."
      intro: "Không phí theo ghế, không gói thuê bao cơ bản theo doanh nghiệp và không thu phí cho doanh nghiệp không hoạt động. Một tài khoản có thể chứa nhiều doanh nghiệp riêng biệt trong bán lẻ, phòng khám, khách sạn và nhà hàng — mỗi doanh nghiệp có không gian làm việc và số dư tín dụng riêng. Bắt đầu với tín dụng khởi đầu miễn phí; không cần thẻ tín dụng."
      free_credits_label: "Tín dụng khởi đầu miễn phí:"
      free_credits_body: "Mỗi doanh nghiệp mới bắt đầu với tín dụng khuyến mãi. Không cần thẻ tín dụng."
      no_per_seat_label: "Không tính phí theo ghế:"
