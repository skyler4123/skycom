    solutions:
      eyebrow: "One universal platform core • Multiple industry adaptations"
      title: "Any Domain, Any Workflow. One Universal Platform Core."
      intro: "Why pay for four platforms with four logins? One Skycom account lets you run distinct businesses — retail, clinic, hotel, and restaurant — on the same POS, booking, reception, inventory, and invoicing core, with one set of credentials and a separate workspace for each business."
      shared_core: "Shared POS, Booking, Reception, Inventory & Invoicing Core"
      retail:
        badge: "Retail & Multi-Store"
        image_alt: "A modern high-tech retail boutique interior"
        title: "Multi-Store Retail Operations"
        description: "Run POS checkout, stock, and purchasing across stores from one workspace. Each business keeps its own branches, warehouses, and team."
        feature_1_title: "POS Checkout & Receipts"
        feature_1_body: "Cash or QR, server-priced"
        feature_2_title: "Multi-Warehouse Stock"
        feature_2_body: "Transfers, imports, exports, adjustments"
        feature_3_title: "Reorder to Purchase"
        feature_3_body: "Low stock to draft purchase"
        feature_4_title: "Custom Product Fields"
        feature_4_body: "Size, color, supplier and more"
        link: "See the POS in the demo"
        footnote: "No platform sales commission"
      dental:
        badge: "Dental & Clinics"
        image_alt: "A modern dental clinic operatory room"
        title: "Clinic Scheduling & Front Desk"
        description: "Book chairs and rooms, check patients in at the front desk, keep patient details in custom fields, and invoice from the same workspace."
        feature_1_title: "Chair & Room Booking"
        feature_1_body: "Conflict-checked reservations"
        feature_2_title: "Front-Desk Check-In"
        feature_2_body: "Visits, host alerts, parcels"
        feature_3_title: "Patient Records"
        feature_3_body: "Typed custom fields per category"
        feature_4_title: "Invoices & Supply Stock"
        feature_4_body: "Tax rate snapshotted per sale"
        link: "See the shared core"
        footnote: "Built on the booking core"
      hotel:
        badge: "Hotels & Hospitality"
        image_alt: "A luxury boutique hotel reception and lobby lounge"
        title: "Room Reservations & Front Desk"
        description: "See the day's room reservations, lock a booking without double-booking, and check guests in from the front desk."
        feature_1_title: "Day Reservation Timeline"
        feature_1_body: "Facilities, hosts, and guests"
        feature_2_title: "Conflict-Checked Locking"
        feature_2_body: "Overlaps refused with the conflicting time"
        feature_3_title: "Front-Desk Check-In"
        feature_3_body: "Walk-ins, host alerts, parcels"
        feature_4_title: "Guest Invoices"
        feature_4_body: "Orders, invoices, receipts"
        link: "See the booking core"
        footnote: "No platform booking fee"
      restaurant:
        badge: "Restaurants & Cafes"
        image_alt: "A bustling upscale restaurant kitchen and dining hall"
        title: "Counter Service & Table Reservations"
        description: "Take counter orders, reserve tables as bookable spaces, and keep stock and purchasing in the same workspace."
        feature_1_title: "POS Counter Service"
        feature_1_body: "Cash or QR checkout"
        feature_2_title: "Table Reservations"
        feature_2_body: "Bookable spaces on the timeline"
        feature_3_title: "Stock & Purchases"
        feature_3_body: "Ingredients as stocked products"
        feature_4_title: "Invoices & Receipts"
        feature_4_body: "Tax snapshot on every sale"
        link: "See the POS & booking core"
        footnote: "Same POS & booking core"
      industries:
        label: "Adaptable to Any Industry:"
        dynamic: "Dynamic Categories & Fields"
        gyms: "Gyms & Fitness Studios"
        automotive: "Automotive & Fleet Repair"
        education: "Education & Academies"
        logistics: "Logistics & Field Services"
        professional: "Professional & Legal Services"
        cta: "+ Create Your Free Account"
      custom:
        title: "Need custom fields for your industry?"
        body: "Categories, typed fields, and table views let you model patient details, room attributes, product specs, or menu data — without a raw JSON editor or a separate database."
        link: "See the platform core"
    multi_tenant:
      eyebrow: "One Login, Multiple Distinct Ventures"
      title: "Single Master Account. Multiple Isolated Businesses."
      intro: "Designed for serial entrepreneurs, family holding offices, hotel-and-restaurant operators, and franchise owners. Stop wrestling with fragmented accounts, passwords, and duplicate monthly base retainers."
      cta: "$0 Base Fee per Business"
      card_1:
        title: "One Master Login, Diverse Holdings"
        body: "Run an apparel boutique, a hotel, and a restaurant from one account. Seamlessly switch contexts with one click — no logging out, no multiple tabs, no separate apps."
        bullet_1: "Complete workspace isolation & separate branch ledgers"
        bullet_2: "Granular staff permissions scoped per business"
        bullet_3: "Separate dashboards, analytics, and billing per business"
        footer: "1-Click Business Switcher"
        badge: "Isolated Workspaces"
      card_2:
        title: "Prepaid Credits per Business"
        body: "Each business keeps its own credit balance and usage history, so spend stays visible per venture. There is no monthly base fee and no per-seat charge."
        bullet_1: "Separate credit balance and usage log per business"
        bullet_2: "No monthly base fee or per-seat software charge"
        bullet_3: "Billing and usage history remain available"
        footer: "Per-Business Credit Wallet"
        badge: "No Monthly Base Fee"
      card_3:
        title: "Create a New Business in Minutes"
        body: "Add a business under the same login and get its own branches, warehouses, roles, categories, and staff. Each business stays fully isolated."
        bullet_1: "Separate branches, warehouses, and staff per business"
        bullet_2: "Starter roles, categories, and dynamic fields"
        bullet_3: "No setup fees and no monthly base fee"
        footer: "Separate Workspace per Business"
        badge: "No Setup Fee"
    platform:
      eyebrow: "The Core Platform"
      title: "Core Operational Pillars Built For Scale"
      intro: "Five purpose-built operation consoles — POS, Booking, Reception, Inventory, and Store Manager — plus the shared catalog, stock, people, and money primitives underneath. Every business runs on the same foundation."
      pos:
        title: "Cloud POS"
        body: "Server-priced checkout with real-time stock, tax, discounts, and a locked till. Cash and QR payments, with a printable receipt. Online-only, with no local software to maintain."
        bullet_1: "Cash and QR checkout"
        bullet_2: "Server-authoritative prices, stock, and tax"
        bullet_3: "Discounts, void, and browser-printable receipt"
        footer: "Real-Time Stock & Pricing"
        badge: "Online-Only"
      inventory:
        title: "Multi-Warehouse Inventory"
        body: "One stock ledger across branches and warehouses, with transfers, imports, exports, and reason-coded adjustments."
        bullet_1: "Immutable stock movement ledger"
        bullet_2: "Branch and warehouse transfers"
        bullet_3: "Low stock to draft purchase order"
        footer: "Manual Reorder to Purchase"
      hr:
        title: "HR, Attendance & Team Records"
        body: "Employee records, departments, roles, documents, shift templates, attendance, and leave requests in one place."
        bullet_1: "Employee profiles, departments, and groups"
        bullet_2: "Shift templates, attendance days, and leave requests"
        bullet_3: "Document storage and role-based access"
        footer: "Attendance & Leave"
      gps:
        title: "GPS-Geofenced Attendance"
        body: "Clock-in is validated against the branch's configured radius and stored with GPS coordinates for audit."
        bullet_1: "Configurable branch radius"
        bullet_2: "GPS coordinates and distance stored per check-in"
        bullet_3: "Rejected check-ins create no attendance event"
        footer: "GPS Audit Trail"
      calendar:
        title: "Operations Calendar"
        body: "A shared calendar for appointments, bookings, and team rosters, with conflict-checked reservations for rooms and spaces."
        bullet_1: "Events and resource reservations"
        bullet_2: "Facility, host, and customer on each booking"
        bullet_3: "Extend, end, or cancel from the console"
        footer: "Conflict-Checked Reservations"
      invoicing:
        title: "Invoicing & Tax Snapshot"
        body: "Turn orders into invoices, keep payment status, and snapshot the tax rate on every sale so later rate changes never rewrite history."
        bullet_1: "Orders to invoices and receipts"
        bullet_2: "Tax rate captured per sale"
        bullet_3: "Branch-scoped invoices and payment status"
        footer: "Tax Rate Captured per Sale"
    pricing:
      badge: "Start Free: No Monthly Base Fee"
      title: "Start Free. Add Businesses Without Monthly Base Fees."
      intro: "No per-seat fees, no per-business base subscription, and no charge for an idle business. A single account can hold multiple distinct businesses across retail, clinic, hotel, and restaurant operations — each with its own isolated workspace and credit balance. Start with free starter credits; no credit card is required."
      free_credits_label: "Free Starter Credits:"
      free_credits_body: "Every new business starts with promotional credits. No credit card needed."
      no_per_seat_label: "No Per-Seat Billing:"
      no_per_seat_body: "Add staff without adding a software bill. Staff accounts are not priced per seat."
      no_monthly_label: "No Monthly Base Fee:"
      no_monthly_body: "An idle business does not carry a monthly subscription or a per-business retainer."
      transparent_label: "Transparent Usage:"
      transparent_body: "Billing and usage pages show the credit balance and movement history for each business."
      cta: "Get Started with Free Credits"
      tier_title: "Free Starter Tier"
      tier_note: "Promotional credits included when the business is created"
      price: "$0 / mo"
