    operators:
      eyebrow: "Built for Multi-Business Operations"
      title: "Built for Operators Who Run More Than One Business"
      intro: "One login, isolated workspaces, and shared operational primitives. Each business keeps its own branches, stock, people, and money — without a separate software stack."
      one_platform_title: "One Platform, Separate Workspaces"
      one_platform_body: "Each business gets its own isolated workspace, branches, warehouses, and team. Switch businesses from the company menu."
      dynamic_title: "Dynamic Categories, Fields & Table Views"
      dynamic_body: "Model industry data with typed custom fields and per-category table columns — no raw JSON and no separate database."
      one_login_title: "One Login for Every Business"
      one_login_body: "Move between businesses without logging out or opening separate apps. Dashboards, analytics, and billing stay scoped to the active business."
      access_title: "Role & Policy-Based Access"
      access_body: "ABAC roles and policies control who can see and do what; permission and configuration changes are logged."
      import_title: "Bulk Import, Export & Migration"
      import_body: "Bring products, stock, customers, and employees in with dry-run imports and configurable migrations; export page data to CSV."
      android_title: "Web + Android Companion"
      android_body: "Run the business on the web and give employees the Android shell for attendance, payroll view, requests, and operation consoles."
