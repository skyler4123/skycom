name: skycom_development
services:
  web:
    build: .
    command: bash -c "sleep 30 && rm -f tmp/pids/server.pid && bundle exec rails db:prepare && bundle exec rails s -b 0.0.0.0 -p 3000"
    environment:
      RAILS_ENV: development
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
    volumes:
      - .:/rails:z
      - sqlite_storage:/rails/storage
    ports:
      # - "80:80"
      # - "443:443"
      - "3000:3000"
    stdin_open: true
    tty: true
    depends_on:
      - postgres
      - minio
      - websocket
      - meilisearch

  job:
    build: .
    command: bash -c "sleep 15 && bundle exec rails db:prepare && bin/jobs"
    environment:
      RAILS_ENV: development
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
    volumes:
      - .:/rails:z
      - sqlite_storage:/rails/storage
    depends_on:
      - web
      - websocket
      - meilisearch

  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
 
  # RustFS Service
  rustfs:
    image: rustfs/rustfs:latest
    ports:
      # RustFS S3 API port
      - "9000:9000" 
      # RustFS Console/UI port
      - "9001:9001" 
    environment:
      # RustFS root user credentials
      RUSTFS_ROOT_USER: admin
      RUSTFS_ROOT_PASSWORD: password
    volumes:
      # Data persistence
      - rustfs_data:/data 
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3

  redis:
    # image: redis:7.2-alpine
    image: valkey/valkey:9.1-alpine
    # container_name: redis_central_cache
    # --appendonly yes ensures your flash sale data is saved to disk continuously
    # command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-secretpassword}"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  openobserve:
    image: openobserve/openobserve:latest
    environment:
      - ZO_DATA_DIR=/data
      - ZO_ROOT_USER_EMAIL=admin@example.com
      - ZO_ROOT_USER_PASSWORD=Password@123
    ports:
      - "5080:5080" # UI and OTel endpoint
    volumes:
      - openobserve_data:/data

  # Centrifugo Real-time Core WebSocket Engine
  websocket:
    image: centrifugo/centrifugo:v5
    volumes:
      - websocket_data:/centrifugo
    ports:
      - "8000:8000"
    command: centrifugo --client_insecure=false --api_insecure=false
    environment:
      # 🚀 Include "null" to allow SharedWorker Data URLs
      CENTRIFUGO_ALLOWED_ORIGINS: "http://localhost:3000 http://127.0.0.1:3000 null"
      # Administrative Backend API Token (Matches Rails CENTRIFUGO_API_KEY)
      CENTRIFUGO_API_KEY: "skycom_super_secret_api_key_2026"
      # Secure Verification Engine Token (Matches Rails CENTRIFUGO_TOKEN_HMAC_SECRET_KEY)
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: "skycom_jwt_hmac_secret_token_key_2026"
      # Enable Centrifugo Administrative Dashboard Interface
      CENTRIFUGO_ADMIN: "true"
      CENTRIFUGO_ADMIN_PASSWORD: "Password@123"
      CENTRIFUGO_ADMIN_SECRET: "Password@123"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Meilisearch Service
  meilisearch:
    image: getmeili/meilisearch:v1.53.1
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    environment:
      MEILI_MASTER_KEY: "skycom_master_key_password_2026"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  mock-api:
    image: golang:1.22-alpine
    working_dir: /go/src/app
    # Line A: Mount your local folder inside the container
    volumes:
      - ./mock_api:/go/src/app:z
    # Line B: Execute the file right out of the mounted folder
    command: go run main.go
    ports:
      - "4000:4000"
    # Allows the mock to reach a Rails app running on the host (bin/dev)
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  mongo_data:
  grafana_data:
  rustfs_data:
  sqlite_storage:
  redis_data:
  openobserve_data:
  websocket_data:
  meilisearch_data:
